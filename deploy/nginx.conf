# Serves the Flutter web build. Behind Caddy, which terminates HTTPS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Calls need camera and microphone on this origin only.
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    # Flutter's file names are not content-hashed: always revalidate so a new
    # release is picked up immediately (ETags keep unchanged files cheap).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        # Deep links such as /consultation/<id> load the app shell.
        try_files $uri $uri/ /index.html;
    }

    # CanvasKit / Skwasm renderers are versioned by directory; cache longer.
    location /canvaskit/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
